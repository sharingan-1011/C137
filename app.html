<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FORGE — C137</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:        #0d0d0d;
  --surface:   #141414;
  --surface2:  #1c1c1c;
  --border:    #2a2a2a;
  --accent:    #7c6af7;
  --accent-lo: rgba(124,106,247,.12);
  --text:      #e8e8e8;
  --muted:     #666;
  --user-bg:   #1e1e2e;
  --tool-bg:   #111;
  --green:     #3fb950;
  --red:       #f85149;
  --yellow:    #d29922;
  --radius:    10px;
  --sidebar-w: 240px;
  --font:      'Inter', system-ui, sans-serif;
  --mono:      'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; }
#app { display: flex; height: 100vh; }
#sidebar {
  width: var(--sidebar-w); background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0; user-select: none;
}
#sidebar-header { padding: 16px 14px 10px; display: flex; align-items: center; gap: 8px; }
#sidebar-header .logo {
  font-size: 18px; font-weight: 700; letter-spacing: -0.5px;
  background: linear-gradient(135deg, var(--accent), #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
#new-chat-btn {
  margin: 6px 10px 10px; padding: 8px 12px;
  background: var(--accent-lo); border: 1px solid rgba(124,106,247,.3);
  border-radius: var(--radius); color: var(--accent);
  cursor: pointer; font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 6px; transition: background .15s;
}
#new-chat-btn:hover { background: rgba(124,106,247,.22); }
#session-list { flex: 1; overflow-y: auto; padding: 0 6px 12px; }
#session-list::-webkit-scrollbar { width: 4px; }
#session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.session-item {
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  color: var(--muted); font-size: 13px;
  transition: background .12s, color .12s; position: relative;
}
.session-item:hover, .session-item.active { background: var(--surface2); color: var(--text); }
.session-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.session-item input.rename-input {
  flex: 1; background: transparent; border: none;
  border-bottom: 1px solid var(--accent); color: var(--text);
  font-size: 13px; font-family: var(--font); outline: none; padding: 0;
}
.session-del {
  opacity: 0; font-size: 11px; color: var(--red);
  padding: 2px 4px; border-radius: 4px; cursor: pointer;
  transition: opacity .1s; flex-shrink: 0;
}
.session-item:hover .session-del { opacity: 1; }
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
#topbar {
  padding: 12px 20px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--surface);
}
#topbar .session-name { font-weight: 600; color: var(--text); }
#topbar .model-badge {
  font-size: 11px; color: var(--muted);
  background: var(--surface2); padding: 3px 8px; border-radius: 20px;
}
#messages { flex: 1; overflow-y: auto; padding: 24px 0; scroll-behavior: smooth; }
#messages::-webkit-scrollbar { width: 5px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.msg-row { max-width: 820px; margin: 0 auto 28px; padding: 0 24px; }
.msg-row.user .bubble {
  background: var(--user-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  line-height: 1.6; white-space: pre-wrap; word-break: break-word;
}
.attach-pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 10px;
  font-size: 12px; color: var(--muted); margin-bottom: 8px;
}
.attach-pill svg { flex-shrink: 0; }
.msg-row.assistant .bubble { line-height: 1.7; word-break: break-word; }
.bubble h1,.bubble h2,.bubble h3,.bubble h4 { margin: 1em 0 .4em; font-weight: 600; }
.bubble h1 { font-size: 1.3em; }
.bubble h2 { font-size: 1.15em; }
.bubble h3 { font-size: 1em; }
.bubble ul,.bubble ol { padding-left: 1.4em; margin: .5em 0; }
.bubble li { margin: .25em 0; }
.bubble p { margin: .5em 0; }
.bubble p:first-child { margin-top: 0; }
.bubble p:last-child  { margin-bottom: 0; }
.bubble code { font-family: var(--mono); font-size: .88em; background: var(--surface2); padding: 2px 5px; border-radius: 4px; }
.bubble pre { margin: .75em 0; border-radius: 8px; overflow: hidden; }
.bubble pre code { background: none; padding: 0; font-size: .83em; }
.bubble pre > code.hljs { padding: 14px 16px !important; }
.bubble blockquote { border-left: 3px solid var(--border); padding-left: 12px; color: var(--muted); margin: .5em 0; }
.bubble table { border-collapse: collapse; width: 100%; margin: .75em 0; }
.bubble th,.bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
.bubble th { background: var(--surface2); font-weight: 600; }
.bubble a { color: var(--accent); text-decoration: none; }
.bubble a:hover { text-decoration: underline; }
.bubble hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
.bubble strong { font-weight: 600; }
.thinking-block { margin-bottom: 12px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.thinking-header {
  display: flex; align-items: center; gap: 6px; cursor: pointer;
  padding: 8px 12px; background: var(--surface2);
  font-size: 12px; color: var(--muted); font-weight: 500; user-select: none;
}
.thinking-header svg { flex-shrink: 0; transition: transform .2s; }
.thinking-block.open .thinking-header svg { transform: rotate(90deg); }
.thinking-body {
  display: none; padding: 10px 12px;
  font-size: 12px; color: var(--muted); font-family: var(--mono);
  white-space: pre-wrap; line-height: 1.5;
  border-top: 1px solid var(--border); max-height: 240px; overflow-y: auto;
}
.thinking-block.open .thinking-body { display: block; }
.tool-card { margin: 8px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--tool-bg); }
.tool-header {
  display: flex; align-items: center; gap: 8px; cursor: pointer;
  padding: 8px 12px; background: var(--surface2);
  font-size: 12px; font-family: var(--mono); user-select: none;
}
.tool-header svg { flex-shrink: 0; transition: transform .2s; }
.tool-card.open .tool-header svg { transform: rotate(90deg); }
.tool-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 3px; letter-spacing: .04em; }
.tool-badge.running { background: rgba(210,153,34,.15); color: var(--yellow); }
.tool-badge.ok      { background: rgba(63,185,80,.12);  color: var(--green); }
.tool-badge.err     { background: rgba(248,81,73,.12);  color: var(--red); }
.tool-body { display: none; }
.tool-card.open .tool-body { display: block; }
.tool-section { padding: 8px 12px; border-top: 1px solid var(--border); }
.tool-section .label { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
.tool-section pre { font-family: var(--mono); font-size: 12px; color: var(--text); white-space: pre-wrap; word-break: break-word; max-height: 300px; overflow-y: auto; }
.tool-output-search { list-style: none; padding: 0; }
.tool-output-search li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; line-height: 1.5; }
.tool-output-search li:last-child { border-bottom: none; }
.tool-output-search .res-title { font-weight: 600; color: var(--text); }
.tool-output-search .res-url { color: var(--accent); font-size: 11px; word-break: break-all; }
.tool-output-search .res-snippet { color: var(--muted); margin-top: 2px; }
.tool-output-repl { background: #0a0a0a; border-radius: 6px; padding: 10px 12px; }
.tool-output-repl pre { font-family: var(--mono); font-size: 12px; color: #d4f0a0; }
.tool-output-repl .exit-badge { display: inline-block; margin-top: 6px; font-size: 10px; font-family: var(--mono); padding: 1px 6px; border-radius: 3px; background: var(--surface2); color: var(--muted); }
.tool-output-shell { background: #0a0a0a; border-radius: 6px; padding: 10px 12px; }
.tool-output-shell pre { font-family: var(--mono); font-size: 12px; color: #c9d1d9; }
.tool-output-shell .exit-badge.ok  { color: var(--green); background: rgba(63,185,80,.1); }
.tool-output-shell .exit-badge.err { color: var(--red);   background: rgba(248,81,73,.1); }
.tool-output-file pre { font-family: var(--mono); font-size: 12px; background: var(--surface2); padding: 10px; border-radius: 6px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; }
#empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--muted); gap: 12px; }
#empty .big { font-size: 36px; }
#empty .tagline { font-size: 15px; }
.cursor { display: inline-block; width: 2px; height: 1em; background: var(--text); vertical-align: text-bottom; animation: blink .9s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
#input-area { padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface); }
#attach-bar {
  display: none; margin-bottom: 8px; padding: 6px 10px;
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; font-size: 12px; color: var(--muted);
  align-items: center; gap: 8px;
}
#attach-bar.visible { display: flex; }
#attach-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#attach-clear { cursor: pointer; color: var(--red); font-size: 14px; line-height: 1; }
#input-row { display: flex; gap: 8px; align-items: flex-end; }
#input-wrap {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: var(--radius); display: flex; align-items: flex-end;
  transition: border-color .15s;
}
#input-wrap:focus-within { border-color: var(--accent); }
#msg-input {
  flex: 1; background: none; border: none; outline: none;
  color: var(--text); font-family: var(--font); font-size: 14px;
  padding: 11px 12px; resize: none; max-height: 160px;
  line-height: 1.5; min-height: 44px;
}
#msg-input::placeholder { color: var(--muted); }
#attach-btn { padding: 10px; background: none; border: none; cursor: pointer; color: var(--muted); transition: color .15s; flex-shrink: 0; align-self: flex-end; }
#attach-btn:hover { color: var(--text); }
#file-input { display: none; }
#send-btn, #stop-btn {
  width: 40px; height: 40px; border-radius: 8px; border: none; cursor: pointer;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 16px; transition: background .15s, opacity .15s;
}
#send-btn { background: var(--accent); color: #fff; }
#send-btn:hover { background: #6b59e0; }
#send-btn:disabled { opacity: .4; cursor: default; }
#stop-btn { background: rgba(248,81,73,.15); color: var(--red); border: 1px solid rgba(248,81,73,.3); display: none; }
#stop-btn:hover { background: rgba(248,81,73,.3); }
#hint { text-align: center; margin-top: 8px; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header"><span class="logo">FORGE</span></div>
    <button id="new-chat-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      New chat
    </button>
    <div id="session-list"></div>
  </div>

  <div id="main">
    <div id="topbar">
      <span class="session-name" id="topbar-title">C137</span>
      <span class="model-badge" id="model-badge">C137</span>
    </div>
    <div id="messages">
      <div id="empty">
        <div class="big">⚡</div>
        <div class="tagline">C137 is ready. Ask anything.</div>
      </div>
    </div>
    <div id="input-area">
      <div id="attach-bar">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
        <span id="attach-name">file.txt</span>
        <span id="attach-clear" title="Remove">✕</span>
      </div>
      <div id="input-row">
        <div id="input-wrap">
          <button id="attach-btn" title="Attach file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file-input">
          <textarea id="msg-input" rows="1" placeholder="Message C137…"></textarea>
        </div>
        <button id="send-btn" title="Send (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <button id="stop-btn" title="Stop generation">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
      </div>
      <div id="hint">Enter to send · Shift+Enter for newline</div>
    </div>
  </div>
</div>

<script>
const API = 'http://localhost:8000';

marked.setOptions({
  breaks: true, gfm: true,
  highlight: (code, lang) => {
    if (lang && hljs.getLanguage(lang)) return hljs.highlight(code, { language: lang }).value;
    return hljs.highlightAuto(code).value;
  }
});

let currentSessionId = null;
let sessions = [];
let streaming = false;
let abortController = null;
let pendingAttach = null;

const msgInput    = document.getElementById('msg-input');
const sendBtn     = document.getElementById('send-btn');
const stopBtn     = document.getElementById('stop-btn');
const sessionList = document.getElementById('session-list');
const messagesEl  = document.getElementById('messages');
const emptyEl     = document.getElementById('empty');
const topbarTitle = document.getElementById('topbar-title');
const newChatBtn  = document.getElementById('new-chat-btn');
const attachBtn   = document.getElementById('attach-btn');
const fileInput   = document.getElementById('file-input');
const attachBar   = document.getElementById('attach-bar');
const attachName  = document.getElementById('attach-name');
const attachClear = document.getElementById('attach-clear');

// ── THE ONLY CHANGED FUNCTION vs previous version ──────────────
async function loadSessions() {
  const res = await fetch(`${API}/sessions`);
  const raw = await res.json();
  // Normalize: backend returns session_id, frontend uses id
  sessions = raw.map(s => ({ ...s, id: s.id ?? s.session_id }));
  renderSidebar();
}
// ───────────────────────────────────────────────────────────────

function renderSidebar() {
  sessionList.innerHTML = '';
  sessions.slice().reverse().forEach(s => {
    const item = document.createElement('div');
    item.className = 'session-item' + (s.id === currentSessionId ? ' active' : '');
    item.dataset.id = s.id;

    const titleEl = document.createElement('span');
    titleEl.className = 'session-title';
    titleEl.textContent = s.title || 'New Chat';

    const delBtn = document.createElement('span');
    delBtn.className = 'session-del';
    delBtn.title = 'Delete';
    delBtn.textContent = '✕';
    delBtn.addEventListener('click', async e => {
      e.stopPropagation();
      if (!confirm(`Delete "${titleEl.textContent}"?`)) return;
      await fetch(`${API}/sessions/${s.id}`, { method: 'DELETE' });
      if (currentSessionId === s.id) { currentSessionId = null; clearMessages(); }
      await loadSessions();
    });

    item.appendChild(titleEl);
    item.appendChild(delBtn);

    titleEl.addEventListener('dblclick', e => {
      e.stopPropagation();
      const inp = document.createElement('input');
      inp.className = 'rename-input';
      inp.value = titleEl.textContent;
      item.replaceChild(inp, titleEl);
      inp.focus(); inp.select();
      const commit = async () => {
        const newTitle = inp.value.trim() || titleEl.textContent;
        await fetch(`${API}/sessions/${s.id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: newTitle }),
        });
        titleEl.textContent = newTitle;
        item.replaceChild(titleEl, inp);
        s.title = newTitle;
        if (s.id === currentSessionId) topbarTitle.textContent = newTitle;
      };
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', ev => {
        if (ev.key === 'Enter') { ev.preventDefault(); inp.blur(); }
        if (ev.key === 'Escape') { item.replaceChild(titleEl, inp); }
      });
    });

    item.addEventListener('click', () => switchSession(s.id));
    sessionList.appendChild(item);
  });
}

async function switchSession(id) {
  currentSessionId = id;
  clearMessages();
  const session = sessions.find(s => s.id === id);
  topbarTitle.textContent = session?.title || 'New Chat';
  await loadHistory(id);
  renderSidebar();
}

function clearMessages() {
  messagesEl.innerHTML = '';
  messagesEl.appendChild(emptyEl);
  emptyEl.style.display = 'flex';
}

async function loadHistory(sessionId) {
  const res  = await fetch(`${API}/sessions/${sessionId}`);
  const data = await res.json();
  if (!data.messages?.length) return;
  emptyEl.style.display = 'none';
  data.messages.forEach(m => {
    if (m.role === 'user') appendUserBubble(m.content);
    else if (m.role === 'assistant') appendAssistantBubble(m.content);
  });
  scrollBottom();
}

newChatBtn.addEventListener('click', async () => {
  const res  = await fetch(`${API}/sessions`, { method: 'POST' });
  const data = await res.json();
  currentSessionId = data.session_id;
  sessions.push({ id: data.session_id, title: 'New Chat' });
  clearMessages();
  topbarTitle.textContent = 'New Chat';
  renderSidebar();
});

function appendUserBubble(text, attachInfo) {
  emptyEl.style.display = 'none';
  const row    = document.createElement('div');
  row.className = 'msg-row user';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (attachInfo) {
    const pill = document.createElement('div');
    pill.className = 'attach-pill';
    pill.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg> ${escHtml(attachInfo.name)}`;
    bubble.appendChild(pill);
    bubble.appendChild(document.createElement('br'));
  }
  const content = document.createElement('span');
  content.textContent = text;
  bubble.appendChild(content);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
  return bubble;
}

function appendAssistantBubble(markdownText) {
  const row    = document.createElement('div');
  row.className = 'msg-row assistant';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = marked.parse(markdownText || '');
  hljs.highlightAll();
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
  return bubble;
}

function createStreamRow() {
  emptyEl.style.display = 'none';
  const row = document.createElement('div');
  row.className = 'msg-row assistant';

  const thinkBlock = document.createElement('div');
  thinkBlock.className = 'thinking-block';
  thinkBlock.style.display = 'none';
  thinkBlock.innerHTML = `
    <div class="thinking-header">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      Thinking…
    </div>
    <div class="thinking-body"></div>`;
  thinkBlock.querySelector('.thinking-header').addEventListener('click', () => thinkBlock.classList.toggle('open'));

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  row.appendChild(thinkBlock);
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  return { row, thinkBlock, bubble };
}

function buildToolCard(callId, name, args) {
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.id = `tc-${callId}`;

  const header = document.createElement('div');
  header.className = 'tool-header';
  header.innerHTML = `
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    <span style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;">tool</span>
    <span style="color:var(--text);font-weight:600;">${escHtml(name)}</span>
    <span class="tool-badge running" id="badge-${callId}">RUNNING</span>`;
  header.addEventListener('click', () => card.classList.toggle('open'));

  const body = document.createElement('div');
  body.className = 'tool-body';

  const argsSection = document.createElement('div');
  argsSection.className = 'tool-section';
  argsSection.innerHTML = `<div class="label">Arguments</div><pre>${escHtml(JSON.stringify(args, null, 2))}</pre>`;
  body.appendChild(argsSection);

  const resultSection = document.createElement('div');
  resultSection.className = 'tool-section';
  resultSection.id = `tr-${callId}`;
  resultSection.innerHTML = `<div class="label">Output</div><pre style="color:var(--muted)">waiting…</pre>`;
  body.appendChild(resultSection);

  card.appendChild(header);
  card.appendChild(body);
  return card;
}

function formatToolOutput(name, rawOutput) {
  let parsed;
  try { parsed = JSON.parse(rawOutput); } catch { return `<pre>${escHtml(rawOutput)}</pre>`; }

  if (name === 'web_search') {
    const results = parsed.results || parsed;
    if (Array.isArray(results)) {
      const items = results.map((r, i) => `
        <li>
          <div class="res-title">${i+1}. ${escHtml(r.title || '')}</div>
          <div class="res-url">${escHtml(r.url || r.href || '')}</div>
          <div class="res-snippet">${escHtml(r.snippet || r.body || '')}</div>
        </li>`).join('');
      return `<ul class="tool-output-search">${items}</ul>`;
    }
  }
  if (name === 'repl_run') {
    const out = (parsed.stdout || '') + (parsed.stderr ? `\nSTDERR:\n${parsed.stderr}` : '');
    return `<div class="tool-output-repl"><pre>${escHtml(out || '(no output)')}</pre></div>`;
  }
  if (name === 'shell_exec') {
    const out = (parsed.stdout || '') + (parsed.stderr ? `\nSTDERR:\n${parsed.stderr}` : '');
    const rc  = parsed.returncode ?? 0;
    return `<div class="tool-output-shell"><pre>${escHtml(out || '(no output)')}</pre><span class="exit-badge ${rc===0?'ok':'err'}">exit ${rc}</span></div>`;
  }
  if (name === 'fs_read') {
    const content = parsed.content ?? parsed;
    return `<div class="tool-output-file"><pre>${escHtml(typeof content === 'string' ? content : JSON.stringify(content, null, 2))}</pre></div>`;
  }
  return `<pre>${escHtml(JSON.stringify(parsed, null, 2))}</pre>`;
}

async function send() {
  const text = msgInput.value.trim();
  if (!text && !pendingAttach) return;
  if (streaming) return;

  if (!currentSessionId) {
    const res  = await fetch(`${API}/sessions`, { method: 'POST' });
    const data = await res.json();
    currentSessionId = data.session_id;
    sessions.push({ id: currentSessionId, title: 'New Chat' });
    renderSidebar();
  }

  let fullMsg = text;
  let attachInfo = null;
  if (pendingAttach) {
    attachInfo = { ...pendingAttach };
    fullMsg = text
      ? `${text}\n\n[Attached file: ${attachInfo.path}]`
      : `[Attached file: ${attachInfo.path}]\nPlease read and describe this file.`;
    clearAttach();
  }

  msgInput.value = '';
  msgInput.style.height = '44px';
  appendUserBubble(fullMsg, attachInfo);

  streaming = true;
  abortController = new AbortController();
  sendBtn.style.display = 'none';
  stopBtn.style.display = 'flex';
  sendBtn.disabled = true;

  const { row, thinkBlock, bubble } = createStreamRow();
  let thinkBuf = '', deltaBuf = '', hasThink = false;
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  bubble.appendChild(cursor);

  try {
    const response = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: currentSessionId, message: fullMsg }),
      signal: abortController.signal,
    });

    const reader  = response.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }

        if (ev.type === 'thinking') {
          if (!hasThink) { thinkBlock.style.display = 'block'; hasThink = true; }
          thinkBuf += ev.text;
          thinkBlock.querySelector('.thinking-body').textContent = thinkBuf;
          scrollBottom();
        }
        else if (ev.type === 'delta') {
          deltaBuf += ev.text;
          bubble.innerHTML = marked.parse(deltaBuf);
          bubble.appendChild(cursor);
          scrollBottom();
        }
        else if (ev.type === 'tool_start') {
          const card = buildToolCard(ev.call_id, ev.name, ev.args || {});
          cursor.remove();
          bubble.innerHTML = marked.parse(deltaBuf);
          row.insertBefore(card, bubble);
          bubble.appendChild(cursor);
          scrollBottom();
        }
        else if (ev.type === 'tool_result') {
          const badge     = document.getElementById(`badge-${ev.call_id}`);
          const resultSec = document.getElementById(`tr-${ev.call_id}`);
          let isErr = false;
          try { if (JSON.parse(ev.output || '{}').error) isErr = true; } catch {}
          if (badge)     { badge.className = `tool-badge ${isErr?'err':'ok'}`; badge.textContent = isErr?'ERR':'OK'; }
          if (resultSec) { resultSec.innerHTML = `<div class="label">Output</div>${formatToolOutput(ev.name, ev.output||'{}')}` ; }
          scrollBottom();
        }
        else if (ev.type === 'done' || ev.type === 'cancelled') {
          cursor.remove();
          bubble.innerHTML = marked.parse(deltaBuf || '');
          bubble.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
          if (hasThink) {
            thinkBlock.querySelector('.thinking-header').innerHTML =
              `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg> Thought process`;
          }
          await loadSessions();
          scrollBottom();
        }
        else if (ev.type === 'error') {
          cursor.remove();
          bubble.innerHTML = `<span style="color:var(--red)">⚠ ${escHtml(ev.detail || 'Unknown error')}</span>`;
        }
      }
    }
  } catch (err) {
    cursor.remove();
    if (err.name !== 'AbortError') {
      bubble.innerHTML = `<span style="color:var(--red)">⚠ Connection error: ${escHtml(String(err))}</span>`;
    } else {
      bubble.innerHTML = marked.parse(deltaBuf || '_(cancelled)_');
    }
  } finally {
    streaming = false;
    abortController = null;
    sendBtn.style.display = 'flex';
    stopBtn.style.display = 'none';
    sendBtn.disabled = false;
    msgInput.focus();
  }
}

stopBtn.addEventListener('click', () => { if (abortController) abortController.abort(); });

attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';
  const fd = new FormData();
  fd.append('file', file);
  try {
    const res  = await fetch(`${API}/upload`, { method: 'POST', body: fd });
    const data = await res.json();
    pendingAttach = { path: data.path, name: data.name };
    attachName.textContent = data.name;
    attachBar.classList.add('visible');
  } catch (err) { alert('Upload failed: ' + err); }
});

function clearAttach() {
  pendingAttach = null;
  attachBar.classList.remove('visible');
  attachName.textContent = '';
}
attachClear.addEventListener('click', clearAttach);

msgInput.addEventListener('input', () => {
  msgInput.style.height = '44px';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 160) + 'px';
});
msgInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
sendBtn.addEventListener('click', send);

function escHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

(async () => {
  await loadSessions();
  if (sessions.length === 0) {
    const res  = await fetch(`${API}/sessions`, { method: 'POST' });
    const data = await res.json();
    currentSessionId = data.session_id;
    sessions.push({ id: currentSessionId, title: 'New Chat' });
    renderSidebar();
  } else {
    await switchSession(sessions[sessions.length - 1].id);
  }
  msgInput.focus();
})();
</script>
