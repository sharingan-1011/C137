[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge"
version = "0.1.0"
description = "C137 FORGE — Agentic Harness Phase 1"
requires-python = ">=3.11"

dependencies = [
    # FastAPI backend
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    # LangChain (Phase 1 — plain LLM; Phase 3 swap to LangGraph)
    "langchain>=0.3",
    "langchain-openai>=0.2",
    # OpenAI SDK (used directly in llm.py)
    "openai>=1.50",
    # Streamlit UI
    "streamlit>=1.38",
    "sseclient-py>=1.8",
    "requests>=2.32",
]

[project.scripts]
forge-backend = "uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
